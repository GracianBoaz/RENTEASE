name: Phase 7 — Deploy Web App to GitHub Pages & Run Live Selenium E2E

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BASE_URL: https://GracianBoaz.github.io/RENTEASE/
  NODE_VERSION: '24'

jobs:
  deploy-and-test-live:
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Repository Checkout
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stage 2: Dependency Installation
      - name: Stage 2 - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Stage 2a - Install Root Dependencies
        run: npm ci

      - name: Stage 2b - Install Website Dependencies
        run: cd website && npm ci

      # Stage 3: Build Application
      - name: Stage 3 - Build Vite Web Application
        run: |
          echo "Building Vite web production bundle..."
          cd website
          npm run build
          echo "Build complete. Output in website/dist"

      # Stage 4: Static Analysis (scoped to website/ ONLY — non-blocking)
      - name: Stage 4 - TypeScript Static Analysis (website only)
        run: |
          echo "Running TypeScript type checks inside website/..."
          cd website
          npx tsc --noEmit 2>&1 | tee /tmp/tsc-output.txt || true
          TSC_ERRORS=$(grep -c "error TS" /tmp/tsc-output.txt 2>/dev/null || echo "0")
          echo "TypeScript errors: ${TSC_ERRORS}"
          if [ "${TSC_ERRORS}" -gt "0" ]; then
            echo "TypeScript errors detected (non-blocking)"
          else
            echo "TypeScript check passed cleanly."
          fi

      # Stage 5: Deploy to GitHub Pages
      - name: Stage 5 - Deploy Application to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
          force_orphan: true

      # Stage 6: Wait for Deployment Propagation
      - name: Stage 6 - Wait for GitHub Pages CDN Propagation (30s)
        run: |
          echo "Waiting 30 seconds for GitHub Pages CDN propagation..."
          sleep 30

      # Stage 7: Deployment Verification
      - name: Stage 7 - Pre-Flight Deployment Verification (HTTP 200)
        run: |
          echo "Verifying Live Deployment: ${{ env.BASE_URL }}"
          MAX_RETRIES=5
          RETRY_DELAY=15
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ env.BASE_URL }}" 2>/dev/null || echo "000")
            echo "Attempt $i/$MAX_RETRIES - HTTP Status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Deployment VERIFIED: HTTP 200 OK"
              break
            fi
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Not ready yet. Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            else
              echo "Warning: Live URL returned HTTP $HTTP_STATUS after $MAX_RETRIES attempts. Proceeding anyway."
            fi
          done

      # Stage 8: Run Selenium E2E Tests (continue-on-error so reports always upload)
      - name: Stage 8 - Run 470 Selenium E2E Tests against LIVE GitHub Pages
        id: selenium_run
        continue-on-error: true
        env:
          BASE_URL: ${{ env.BASE_URL }}
          HEADLESS: "true"
          CI: "true"
        run: |
          echo "Starting Live Selenium E2E Suite"
          echo "Target: $BASE_URL"
          echo "Test Cases: 470 across 14 modules"
          node automation/selenium/runners/runSeleniumLive.js

      # Stage 8.5: Run Baseline Load Test (100 Users, 1 min)
      - name: Stage 8.5 - Run Baseline Load Test
        id: load_run
        continue-on-error: true
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: |
          echo "Starting Load Test against Live URL: $BASE_URL"
          node tests/load/loadTestRunner.js

      # Stage 9 & 10: Verify Generated Reports
      - name: "Stage 9 & 10 - Verify Generated Reports"
        if: always()
        run: |
          echo "=== Excel Reports ==="
          ls -la "Test Results/Excel/" 2>/dev/null || echo "Excel directory not found"
          echo "=== HTML Reports ==="
          ls -la "Test Results/HTML/" 2>/dev/null || echo "HTML directory not found"
          echo "=== JSON Results ==="
          ls -la "Test Results/JSON/" 2>/dev/null || echo "JSON directory not found"
          echo "=== Screenshots (first 20) ==="
          ls -la "Test Results/Screenshots/" 2>/dev/null | head -20 || echo "Screenshots directory not found"

      # Stage 11: Upload Artifacts (30-Day Retention)
      - name: Stage 11 - Upload E2E Test Artifacts (30 Day Retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RentEase-Live-Selenium-E2E-Reports-Build-${{ github.run_number }}
          path: |
            Test Results/Excel/
            Test Results/HTML/
            Test Results/JSON/
            Test Results/Screenshots/
            Test Results/Logs/
            Test Results/Summary/
            tests/load/reports/
          retention-days: 30
          if-no-files-found: warn

      # Stage 12: Publish GitHub Action Step Summary
      - name: Stage 12 - Publish GitHub Action Execution Summary
        if: always()
        run: |
          echo "## RentEase Live Selenium E2E - Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live Deployment URL**: ${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Date**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "**Selenium Outcome**: ${{ steps.selenium_run.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: RentEase-Live-Selenium-E2E-Reports-Build-${{ github.run_number }} (retained 30 days)" >> $GITHUB_STEP_SUMMARY

      # Stage 13: Store Historical Execution Record (JSON file — no git push required)
      - name: Stage 13 - Store Historical Test Execution Record
        if: always()
        run: |
          echo "Storing Historical Execution Record for Build #${{ github.run_number }}"
          HISTORY_DIR="Test Results/History"
          mkdir -p "$HISTORY_DIR"
          ENTRY="{\"build\": ${{ github.run_number }}, \"commit\": \"${{ github.sha }}\", \"branch\": \"${{ github.ref_name }}\", \"date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"outcome\": \"${{ steps.selenium_run.outcome }}\", \"artifact\": \"RentEase-Live-Selenium-E2E-Reports-Build-${{ github.run_number }}\"}"
          echo "[$ENTRY]" > "$HISTORY_DIR/build-${{ github.run_number }}.json"
          echo "History record saved."
          cat "$HISTORY_DIR/build-${{ github.run_number }}.json"

      # Stage Final: Explicitly fail the job if Selenium tests had failures
      - name: Stage Final - Fail Job on Test Failures
        if: steps.selenium_run.outcome == 'failure'
        run: |
          echo "Selenium E2E tests had failures. Check artifacts for full reports."
          echo "Artifact: RentEase-Live-Selenium-E2E-Reports-Build-${{ github.run_number }}"
          exit 1
