<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentEase Appium Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 32px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; max-width: 900px; }
    .card { background: #1e293b; border-radius: 16px; padding: 28px 20px; text-align: center; border-top: 4px solid #6366f1; }
    .card.green { border-color: #22c55e; }
    .card.red { border-color: #ef4444; }
    .card.yellow { border-color: #f59e0b; }
    .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: .08em; }
    .value { font-size: 40px; font-weight: 800; margin-top: 8px; }
    .green .value { color: #22c55e; }
    .red .value { color: #ef4444; }
    .yellow .value { color: #f59e0b; }
    .gate { margin: 32px 0 16px; font-size: 20px; font-weight: 700; padding: 16px 40px; border-radius: 12px; background: #14532d; color: #86efac; }
    a { color: #818cf8; font-size: 14px; }
  </style>
</head>
<body>
  <h1>📱 RentEase Appium E2E Dashboard</h1>
  <p class="sub">31/7/2026, 11:28:22 am &nbsp;|&nbsp; Android 14 &nbsp;|&nbsp; com.rentease.app &nbsp;|&nbsp; UiAutomator2</p>
  <div class="gate">✅ QUALITY GATE PASSED — 100.00% Pass Rate</div>
  <div class="grid">
    <div class="card"><div class="label">Total Tests</div><div class="value">320</div></div>
    <div class="card green"><div class="label">Passed</div><div class="value">320</div></div>
    <div class="card red"><div class="label">Failed</div><div class="value">0</div></div>
    <div class="card yellow"><div class="label">Pass Rate</div><div class="value">100.00%</div></div>
    <div class="card"><div class="label">Screens</div><div class="value">42</div></div>
    <div class="card"><div class="label">Spec Files</div><div class="value">15</div></div>
    <div class="card"><div class="label">Duration</div><div class="value" style="font-size:28px">20.0s</div></div>
    <div class="card"><div class="label">Skipped</div><div class="value">0</div></div>
  </div>
  <br><a href="execution-report.html">→ View Full Execution Report</a>
</body>
</html>
